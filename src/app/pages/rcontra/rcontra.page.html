<ion-header [translucent]="true">
  <ion-buttons slot="start">
    <ion-back-button defaulHref="/login"></ion-back-button>
  </ion-buttons>
  <ion-toolbar>
    <ion-title>Recuperar Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-card-header style="text-align: center;">
      <ion-card-title>¿A olvidado su contraseña?</ion-card-title>
    </ion-card-header>
  
    <form (ngSubmit)="sendRecoveryEmail()" #recoveryForm="ngForm">
      <ion-item>
        <ion-label position="floating">Correo Electrónico</ion-label>
        <ion-input type="email" required [(ngModel)]="email" name="email"></ion-input>
      </ion-item>
  
      <ion-button expand="block" type="submit" [disabled]="!recoveryForm.form.valid">
        Enviar Email de Recuperación
      </ion-button>
    </form>
</ion-content>
